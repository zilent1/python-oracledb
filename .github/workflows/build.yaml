name: Build python-oracledb packages

# fork: release tags are "o5-v<version>" (e.g. o5-v26.1.0.1) so they never
# collide with the upstream "v*" tags fetched from oracle/python-oracledb
on:
  push:
    tags:
      - o5-v*
  workflow_dispatch:
    inputs:
      tgt:
        description: List of package targets to build
        default: 'Linux, macOS, Windows, Source'
        required: false
      publish:
        description: Publish a full build to TestPyPI
        type: boolean
        default: false
permissions:
  contents: read

jobs:

  build_source_package:
    name: Build source package
    if: contains(inputs.tgt, 'Source') || inputs.tgt == ''
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
                                  # v6.2.0
        with:
          cache: 'pip'
          python-version: 3.13

      - name: Ensure packages required to build are present
        run: python -m pip install cython setuptools

      - name: Build wheel for Python ${{ matrix.python-version }}
        run: python setup.py sdist

      - name: Upload the artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
                                     # v7.0.1
        with:
          name: python-oracledb-source
          path: dist

  build_linux_wheels:
    name: Build wheels for Linux
    if: contains(inputs.tgt, 'Linux') || inputs.tgt == ''
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            platform: amd64
            container: quay.io/pypa/manylinux_2_28_x86_64
            clib: gnu
          - os: ubuntu-24.04-arm
            platform: arm64
            container: quay.io/pypa/manylinux_2_28_aarch64
            clib: gnu
          - os: ubuntu-24.04
            platform: amd64
            container: quay.io/pypa/musllinux_1_2_x86_64
            clib: musl
          - os: ubuntu-24.04-arm
            platform: arm64
            container: quay.io/pypa/musllinux_1_2_aarch64
            clib: musl

    steps:

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - name: Generate script
        run: |
          echo export PYO_COMPILE_ARGS=-g0 > build.sh
          echo /opt/python/cp310-cp310/bin/python3.10 -m build >> build.sh
          echo /opt/python/cp311-cp311/bin/python3.11 -m build >> build.sh
          echo /opt/python/cp312-cp312/bin/python3.12 -m build >> build.sh
          echo /opt/python/cp313-cp313/bin/python3.13 -m build >> build.sh
          echo /opt/python/cp314-cp314/bin/python3.14 -m build >> build.sh
          echo /opt/python/cp315-cp315/bin/python3.15 -m build >> build.sh
          echo cd dist >> build.sh
          echo auditwheel repair *.whl >> build.sh
          echo rm *.whl >> build.sh
          echo mv wheelhouse/*.whl . >> build.sh
          chmod +x build.sh

      - name: Build wheels
        run: |
          docker run \
            -v $(pwd):/io  \
            -w /io \
            --platform linux/${{ matrix.platform }} \
            ${{ matrix.container }} \
            ./build.sh

      - name: Upload the artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
                                     # v7.0.1
        with:
          name: Linux_${{ matrix.platform }}_${{ matrix.clib}}_wheels
          path: dist/*.whl

  build_macos_wheels:
    name: Build wheels for macOS
    if: contains(inputs.tgt, 'macOS') || inputs.tgt == ''
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        arch: ['']

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
                                  # v6.2.0
        with:
          cache: 'pip'
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.arch }}
          allow-prereleases: true

      - name: Ensure build package is present
        run: python -m pip install build

      - name: Build wheel for Python ${{ matrix.python-version }}
        run: python -m build

      - name: Upload the artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
                                     # v7.0.1
        with:
          name: python-oracledb-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.arch }}
          path: dist/*.whl

  build_windows_wheels:
    name: Build wheels for Windows
    if: contains(inputs.tgt, 'Windows') || inputs.tgt == ''
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        arch: ['x86', 'x64']
        include:
          - os: windows-11-arm
            arch: arm64
            python-version: '3.11'
          - os: windows-11-arm
            arch: arm64
            python-version: '3.12'
          - os: windows-11-arm
            arch: arm64
            python-version: '3.13'
          - os: windows-11-arm
            arch: arm64
            python-version: '3.14'
          - os: windows-11-arm
            arch: arm64
            python-version: '3.15'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
                                  # v6.2.0
        with:
          cache: 'pip'
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.arch }}
          allow-prereleases: true

      - name: Ensure build package is present
        run: python -m pip install build

      - name: Build wheel for Python ${{ matrix.python-version }}
        run: python -m build

      - name: Upload the artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
                                     # v7.0.1
        with:
          name: python-oracledb-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.arch }}
          path: dist/*.whl

  combine_artifacts:
    name: Combine artifacts
    if: ${{ always() }}
    needs: [build_source_package, build_linux_wheels, build_macos_wheels, build_windows_wheels]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/upload-artifact/merge@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
                                           # v7.0.1
        with:
          name: python-oracledb-wheels
          delete-merged: true

  # fork: publish through PyPI Trusted Publishing (OIDC, no stored token).
  # Tag pushes go to PyPI; a manual run with "publish" checked goes to
  # TestPyPI. Both need every build job to succeed.
  publish:
    name: Publish to ${{ github.event_name == 'push' && 'PyPI' || 'TestPyPI' }}
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/o5-v'))
      || (github.event_name == 'workflow_dispatch' && inputs.publish
          && inputs.tgt == 'Linux, macOS, Windows, Source')
    needs: [build_source_package, build_linux_wheels, build_macos_wheels,
            build_windows_wheels, combine_artifacts]
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'push' && 'pypi' || 'testpypi' }}
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check that the tag matches the package version
        if: github.event_name == 'push'
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' \
                    src/oracledb/version.py)
          if [ "o5-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match version $version"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
                                       # v8.0.2
        with:
          name: python-oracledb-wheels
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
                                         # v1.14.3
        with:
          repository-url: ${{ github.event_name == 'push' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
